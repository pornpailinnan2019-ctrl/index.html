<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางเรียนพิเศษคณิตศาสตร์ ครูแนน</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Font: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #fff5f8;
        }
        .kawaii-card {
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(255, 182, 193, 0.3), 0 8px 10px -6px rgba(255, 182, 193, 0.2);
            border: 2px solid #ffd1dc;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-slate-700">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header Section -->
        <header class="kawaii-card bg-white p-6 flex flex-col md:flex-row justify-between items-center gap-4 relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-pink-100 rounded-full blur-xl opacity-60 pointer-events-none"></div>
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-purple-100 rounded-full blur-xl opacity-60 pointer-events-none"></div>

            <div class="text-center md:text-left z-10">
                <span class="bg-pink-100 text-pink-600 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Math Tutoring Dashboard</span>
                <h1 class="text-2xl md:text-3xl font-bold text-pink-600 mt-1">✨ ตารางเรียนพิเศษคณิตศาสตร์ ครูแนน ✨</h1>
                <p class="text-sm text-slate-500">ระบบจัดการตารางสอน เช็คชื่อนักเรียน และประกาศแจ้งเตือนอัจฉริยะ</p>
            </div>

            <!-- Mode Switcher & Auth -->
            <div class="flex items-center gap-3 z-10">
                <div id="modeBadge" class="px-4 py-2 rounded-full text-sm font-medium bg-pink-50 text-pink-600 border border-pink-200 shadow-sm">
                    🔒 โหมดนักเรียน (อ่านอย่างเดียว)
                </div>
                <button onclick="toggleAuthMode()" id="authBtn" class="bg-pink-500 hover:bg-pink-600 text-white font-medium px-4 py-2 rounded-xl transition shadow-md cursor-pointer text-sm flex items-center gap-1.5">
                    🔑 เข้าสู่โหมดครู
                </button>
            </div>
        </header>

        <!-- AI Notice Generator Box -->
        <section class="kawaii-card bg-white p-6 relative">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-3">
                <h2 class="text-lg font-semibold text-pink-600 flex items-center gap-2">
                    📢 ประกาศ / หมายเหตุพิเศษ
                </h2>
                <button onclick="generateAiNotice()" class="bg-gradient-to-r from-purple-400 to-pink-400 hover:from-purple-500 hover:to-pink-500 text-white text-xs font-medium px-3.5 py-2 rounded-xl transition shadow-sm flex items-center gap-1.5 cursor-pointer teacher-only">
                    ✨ AI ช่วยออกแบบประกาศ
                </button>
            </div>
            <textarea id="specialNotice" rows="2" class="w-full p-3 border border-pink-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm bg-pink-50/30" placeholder="พิมพ์ประกาศแจ้งเตือนนักเรียนที่นี่ หรือให้ AI ช่วยออกแบบ..." oninput="saveData()"></textarea>
        </section>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Left Panel: Students List -->
            <div class="lg:col-span-1 kawaii-card bg-white p-5
