<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เรียนพิเศษคณิตศาสตร์ ครูแนน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-sky-50 text-slate-700 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-80usWoZI1rKT-9wgesJcYhg6y2iNXWQonx7Jb91b-1GMxi-nvnUB1qcFrfcwFiI/exec";

        function App() {
            const [role, setRole] = React.useState('student');
            const [showPinModal, setShowPinModal] = React.useState(false);
            const [pinInput, setPinInput] = React.useState('');
            const [pinError, setPinError] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState('schedule');
            const [toastMessage, setToastMessage] = React.useState('');
            const [loading, setLoading] = React.useState(true);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const [scheduleMonthYear, setScheduleMonthYear] = React.useState('พฤศจิกายน 2569');
            const [showEditMonthModal, setShowEditMonthModal] = React.useState(false);
            const [newMonthYearInput, setNewMonthYearInput] = React.useState('');

            const [columns, setColumns] = React.useState([]);
            const [timeSlots, setTimeSlots] = React.useState([]);
            const [notes, setNotes] = React.useState([]);
            const [classesList, setClassesList] = React.useState([]);

            const [selectedClassForCheckin, setSelectedClassForCheckin] = React.useState(null);
            const [showAddClassModal, setShowAddClassModal] = React.useState(false);
            const [newClassName, setNewClassName] = React.useState('');
            const [editingFeeStudent, setEditingFeeStudent] = React.useState(null);

            // โหลดข้อมูลผ่าน Fetch API จาก Google Apps Script
            React.useEffect(() => {
                fetch(SCRIPT_URL + "?action=get")
                    .then(res => res.json())
                    .then(data => {
                        if (data) {
                            if (data.monthYear) setScheduleMonthYear(data.monthYear);
                            if (data.columns) setColumns(data.columns);
                            if (data.timeSlots) setTimeSlots(data.timeSlots);
                            if (data.notes) setNotes(data.notes);
                            if (data.classesList) setClassesList(data.classesList);
                        }
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error(err);
                        setLoading(false);
                    });
            }, []);

            // ฟังก์ชันบันทึกข้อมูลออนไลน์ไปยัง Google Sheets
            const saveDataToCloud = (newData) => {
                const payload = {
                    monthYear: newData.monthYear || scheduleMonthYear,
                    columns: newData.columns || columns,
                    timeSlots: newData.timeSlots || timeSlots,
                    notes: newData.notes || notes,
                    classesList: newData.classesList || classesList
                };

                fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }).then(() => {
                    showToast('บันทึกข้อมูลลง Google Sheets แล้ว');
                }).catch(err => console.error(err));
            };

            const handleRoleSwitch = (targetRole) => {
                if (targetRole === 'teacher') {
                    setShowPinModal(true);
                    setPinInput('');
                    setPinError(false);
                } else {
                    setRole('student');
                    showToast('สลับเป็นโหมดนักเรียนเรียบร้อย');
                }
            };

            const verifyPin = (e) => {
                e.preventDefault();
                if (pinInput === '123456') {
                    setRole('teacher');
                    setShowPinModal(false);
                    showToast('เข้าสู่โหมดคุณครูสำเร็จ');
                } else {
                    setPinError(true);
                }
            };

            const addColumn = () => {
                const newColId = 'col_' + Date.now();
                const newCols = [...columns, { id: newColId, date: 'วันใหม่' }];
                const newSlots = timeSlots.map(slot => ({
                    ...slot,
                    data: { ...slot.data, [newColId]: 'ปกติ' }
                }));
                setColumns(newCols);
                setTimeSlots(newSlots);
                showToast('เพิ่มช่องวันที่เรียนแล้ว');
                saveDataToCloud({ columns: newCols, timeSlots: newSlots });
            };

            const deleteColumn = (colId) => {
                const newCols = columns.filter(c => c.id !== colId);
                setColumns(newCols);
                showToast('ลบช่องวันที่เรียนแล้ว');
                saveDataToCloud({ columns: newCols });
            };

            const addTimeSlot = () => {
                const newId = 't_' + Date.now();
                const emptyData = {};
                columns.forEach(col => { emptyData[col.id] = 'ปกติ'; });
                const newSlots = [...timeSlots, { id: newId, time: '09.00 - 11.00 น.', data: emptyData }];
                setTimeSlots(newSlots);
                showToast('เพิ่มช่วงเวลาเรียนแล้ว');
                saveDataToCloud({ timeSlots: newSlots });
            };

            const deleteTimeSlot = (slotId) => {
                const newSlots = timeSlots.filter(s => s.id !== slotId);
                setTimeSlots(newSlots);
                showToast('ลบช่วงเวลาเรียนแล้ว');
                saveDataToCloud({ timeSlots: newSlots });
            };

            const toggleAttendance = (classId, studentId, amount) => {
                if (role !== 'teacher') return;
                const updated = classesList.map(cls => {
                    if (cls.id === classId) {
                        return {
                            ...cls,
                            students: cls.students.map(s => s.id === studentId ? { ...s, attended: s.attended + amount } : s)
                        };
                    }
                    return cls;
                });
                setClassesList(updated);
                if (selectedClassForCheckin && selectedClassForCheckin.id === classId) {
                    setSelectedClassForCheckin(updated.find(c => c.id === classId));
                }
                showToast('อัปเดตคาบเรียนแล้ว');
                saveDataToCloud({ classesList: updated });
            };

            const togglePaidStatus = (classId, studentId) => {
                if (role !== 'teacher') return;
                const updated = classesList.map(cls => {
                    if (cls.id === classId) {
                        return {
                            ...cls,
                            students: cls.students.map(s => s.id === studentId ? { ...s, paid: !s.paid } : s)
                        };
                    }
                    return cls;
                });
                setClassesList(updated);
                showToast('อัปเดตสถานะการชำระเงินแล้ว');
                saveDataToCloud({ classesList: updated });
            };

            const updateStudentFee = (classId, studentId, newAmount) => {
                const updated = classesList.map(cls => {
                    if (cls.id === classId) {
                        return {
                            ...cls,
                            students: cls.students.map(s => s.id === studentId ? { ...s, amount: Number(newAmount) || 0 } : s)
                        };
                    }
                    return cls;
                });
                setClassesList(updated);
                setEditingFeeStudent(null);
                showToast('อัปเดตยอดค่าเรียนแล้ว');
                saveDataToCloud({ classesList: updated });
            };

            const addStudentToClass = (classId, name, nickname, amount) => {
                const updated = classesList.map(cls => {
                    if (cls.id === classId) {
                        const newStu = { id: 's_' + Date.now(),
